version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inspire_postgres
    environment:
      POSTGRES_USER: inspire
      POSTGRES_PASSWORD: inspire
      POSTGRES_DB: inspire
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inspire']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
